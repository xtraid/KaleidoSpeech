apiVersion: v1
kind: ConfigMap
metadata:
  name: advx-config
data:
  APP_HOST: "0.0.0.0"
  APP_PORT: "8000"
  REDIS_URL: "redis://redis:6379/0"
  SQLITE_PATH: "/app/data/pronunciation.sqlite3"
  PHONETIC_ENABLED: "false"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: advx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: advx
  template:
    metadata:
      labels:
        app: advx
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: advx-speech-service:0.1.0
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: advx-config
            - secretRef:
                name: advx-secrets
          readinessProbe:
            httpGet:
              path: /health/sqlite
              port: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: sqlite
              mountPath: /app/data
      volumes:
        - name: sqlite
          persistentVolumeClaim:
            claimName: advx-sqlite
---
apiVersion: v1
kind: Service
metadata:
  name: advx
spec:
  selector:
    app: advx
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: advx-sqlite
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
