<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pronunciation Practice</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: 'Nunito', system-ui, sans-serif;
    background: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    color: #1a1a1a;
    overflow: hidden;
  }

  .phone {
    position: relative;
    width: min(420px, 100vw);
    height: min(910px, 100vh);
    aspect-ratio: 9 / 19.5;
    background: #f5f3ee;
    border-radius: 44px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4), 0 0 0 8px #0f0f0f, 0 0 0 10px #2a2a2a;
    display: flex;
    flex-direction: column;
    transition: background 0.8s ease;
  }
  .scene-bg {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    opacity: 0;
    transition: opacity 0.9s ease;
    pointer-events: none;
    z-index: 0;
  }
  .scene-bg.active { opacity: 1; }
  .scene-veil {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(to bottom,
        rgba(255,255,255,0.55) 0%,
        rgba(255,255,255,0.15) 22%,
        rgba(255,255,255,0) 40%,
        rgba(255,255,255,0) 60%,
        rgba(255,255,255,0.2) 80%,
        rgba(255,255,255,0.55) 100%);
    pointer-events: none;
    z-index: 1;
  }
  .top-bar, .word-wrap, .kaleido-wrap, .mic-area, .controls, .result-area {
    position: relative;
    z-index: 2;
  }
  @media (max-width: 480px) {
    body { background: #f5f3ee; }
    .phone {
      width: 100vw; height: 100vh; max-height: 100dvh;
      border-radius: 0; box-shadow: none; aspect-ratio: auto;
    }
  }

  /* Top bar */
  .top-bar {
    padding: 20px 22px 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-shrink: 0;
  }
  .level-chip {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600; font-size: 12px;
    letter-spacing: 0.08em; text-transform: uppercase;
    background: rgba(0,0,0,0.08);
    padding: 6px 12px; border-radius: 999px;
    color: rgba(0,0,0,0.6);
  }
  .progress-bar {
    flex: 1; height: 8px;
    background: rgba(0,0,0,0.08);
    border-radius: 999px; overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #fbbf24, #f97316, #ef4444);
    border-radius: 999px; width: 0%;
    transition: width 0.5s cubic-bezier(.34,1.56,.64,1);
  }
  .conn-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #94a3b8;
    flex-shrink: 0;
    transition: background 0.3s ease;
  }
  .conn-dot.connected { background: #22c55e; }
  .conn-dot.connecting { background: #fbbf24; animation: blink 0.8s ease infinite; }
  .conn-dot.error { background: #ef4444; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* Exercise info chip */
  .exercise-info {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 2px 22px 4px;
    flex-shrink: 0;
  }
  .exercise-tag {
    font-family: 'Fredoka', sans-serif;
    font-size: 10px; font-weight: 500;
    letter-spacing: 0.08em; text-transform: uppercase;
    background: rgba(0,0,0,0.06);
    color: rgba(0,0,0,0.45);
    padding: 3px 8px; border-radius: 6px;
  }

  /* Word */
  .word-wrap {
    padding: 10px 20px 4px;
    text-align: center;
    flex-shrink: 0;
  }
  .word-hint {
    font-family: 'Fredoka', sans-serif;
    font-size: 12px;
    color: rgba(0,0,0,0.45);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin: 0 0 4px;
    font-weight: 500;
  }
  .word {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: clamp(22px, 5.5vw, 30px);
    letter-spacing: 0.01em;
    color: #1a1a1a;
    margin: 0;
    line-height: 1.35;
    transition: transform 0.3s cubic-bezier(.34,1.56,.64,1);
  }
  .word.pop { transform: scale(1.06); }
  .word .tok {
    display: inline-block;
    color: rgba(0,0,0,0.32);
    transition: color 0.25s ease, transform 0.25s cubic-bezier(.34,1.56,.64,1);
    margin: 0 2px;
  }
  .word .tok.read { color: rgba(0,0,0,0.75); }
  .word .tok.current { color: #1a1a1a; font-weight: 700; transform: translateY(-2px) scale(1.08); }
  .word .tok.failed {
    color: #dc2626; font-weight: 700;
    animation: word-shake 0.35s ease;
  }
  .word .tok.low-conf {
    color: #d97706; font-weight: 700;
    animation: word-shake 0.35s ease;
  }
  @keyframes word-shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    50% { transform: translateX(4px); }
    75% { transform: translateX(-2px); }
  }

  /* Kaleidoscope */
  .kaleido-wrap {
    position: relative;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px 20px;
    min-height: 0;
  }
  .kaleido-inner {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    max-height: 100%;
    filter: drop-shadow(0 8px 20px rgba(0,0,0,0.25));
  }
  #kaleido { width: 100%; height: 100%; display: block; }

  /* Burst overlay */
  .burst {
    position: absolute; inset: 0;
    pointer-events: none; opacity: 0;
    background: radial-gradient(circle at 50% 50%, #fff 0%, rgba(255,255,255,0.9) 30%, rgba(255,255,255,0) 70%);
    z-index: 5;
  }
  .levelup {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none; z-index: 10; opacity: 0;
  }
  .levelup-inner {
    font-family: 'Fredoka', sans-serif;
    font-weight: 700; font-size: 44px; color: #fff;
    text-shadow: 0 4px 20px rgba(0,0,0,0.4), 0 0 30px rgba(255,220,100,0.6);
    letter-spacing: 0.04em; text-transform: uppercase;
    transform: scale(0.6);
    transition: transform 0.4s cubic-bezier(.34,1.56,.64,1);
    text-align: center;
  }
  .levelup.show { opacity: 1; }
  .levelup.show .levelup-inner { transform: scale(1); }
  .levelup-sub {
    font-size: 14px; letter-spacing: 0.2em; opacity: 0.85;
    margin-top: 6px; font-weight: 500;
  }
  .confetti-piece {
    position: absolute; width: 10px; height: 14px;
    border-radius: 2px; pointer-events: none; z-index: 8;
  }

  /* Mic button */
  .mic-area {
    display: flex; flex-direction: column;
    align-items: center; gap: 6px;
    padding: 10px 22px 12px;
    flex-shrink: 0;
  }
  .mic-btn {
    width: 82px; height: 82px; border-radius: 50%;
    border: 4px solid rgba(37,99,235,0.22);
    background: rgba(255,255,255,0.94);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s ease;
    -webkit-tap-highlight-color: transparent;
    box-shadow: 0 7px 0 rgba(37,99,235,0.18), 0 10px 28px rgba(15,23,42,0.18);
  }
  .mic-btn:hover { transform: translateY(-2px); }
  .mic-btn:active { transform: scale(0.92); }
  .mic-btn svg { width: 38px; height: 38px; fill: #2563eb; transition: fill 0.2s; }
  .mic-btn.listening {
    background: #dbeafe; border-color: #3b82f6;
    transform: scale(var(--voice-scale, 1));
    box-shadow:
      0 0 0 var(--voice-ring, 7px) rgba(59,130,246,0.22),
      0 8px 24px rgba(37,99,235,0.22);
    transition: transform 70ms linear, box-shadow 70ms linear, background 120ms ease;
  }
  .mic-btn.listening.hearing { background: #bfdbfe; }
  .mic-btn.listening.hearing svg { transform: scale(1.08); }
  .mic-btn.listening svg { fill: #1d4ed8; }
  .mic-btn.processing {
    background: #fef3c7; border-color: #f59e0b;
    animation: mic-pulse 0.6s ease infinite;
  }
  .mic-btn.processing svg { fill: #d97706; }
  @keyframes mic-pulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(59,130,246,0.3); }
    50% { box-shadow: 0 0 0 12px rgba(59,130,246,0); }
  }
  .mic-label {
    font-family: 'Fredoka', sans-serif;
    font-size: 12px; font-weight: 600;
    color: rgba(0,0,0,0.62);
    letter-spacing: 0.1em; text-transform: uppercase;
    min-height: 16px;
  }

  /* Result display */
  .result-area {
    padding: 4px 22px 4px;
    flex-shrink: 0;
    min-height: 60px;
  }
  .result-card {
    background: rgba(255,255,255,0.85);
    border-radius: 16px;
    padding: 10px 16px;
    opacity: 0;
    transform: translateY(8px);
    transition: all 0.3s ease;
  }
  .result-card.visible {
    opacity: 1;
    transform: translateY(0);
  }
  .result-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
  }
  .result-verdict {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600; font-size: 14px;
  }
  .result-verdict.correct { color: #16a34a; }
  .result-verdict.incorrect { color: #dc2626; }
  .result-verdict.low-conf { color: #d97706; }
  .result-meta {
    font-family: 'Fredoka', sans-serif;
    font-size: 10px; color: rgba(0,0,0,0.35);
  }
  .phoneme-row {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    margin-top: 4px;
  }
  .phoneme-cell {
    font-family: 'Fredoka', sans-serif;
    font-size: 13px; font-weight: 600;
    padding: 3px 8px; border-radius: 8px;
    background: rgba(0,0,0,0.05);
    color: #1a1a1a;
  }
  .phoneme-cell.match { background: #dcfce7; color: #16a34a; }
  .phoneme-cell.mismatch { background: #fee2e2; color: #dc2626; }
  /* Chinese tone annotation */
  .tone-label {
    font-size: 9px; display: block;
    text-align: center; margin-top: 1px;
    color: rgba(0,0,0,0.4);
  }
  .tone-label.wrong-tone { color: #dc2626; }

  /* Controls (mock mode) */
  .controls {
    display: none;
    gap: 10px;
    padding: 8px 22px 24px;
    flex-shrink: 0;
    justify-content: center;
  }
  .btn {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600; font-size: 15px;
    padding: 12px 0;
    border-radius: 999px;
    border: 3px solid transparent;
    cursor: pointer;
    transition: transform 0.1s ease;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    flex: 1;
    max-width: 120px;
  }
  .btn:active { transform: scale(0.95); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-wrong { background: #fee2e2; color: #dc2626; border-color: rgba(220,38,38,0.35); box-shadow: 0 4px 0 rgba(220,38,38,0.18); }
  .btn-right { background: #dcfce7; color: #16a34a; border-color: rgba(22,163,74,0.35); box-shadow: 0 4px 0 rgba(22,163,74,0.2); }
  .btn-lowconf { background: #fef3c7; color: #d97706; border-color: rgba(217,119,6,0.35); box-shadow: 0 4px 0 rgba(217,119,6,0.18); font-size: 11px; }
  .btn-retry {
    background: rgba(255,255,255,0.7); color: #475569;
    border: 2px dashed rgba(71,85,105,0.4);
    box-shadow: none; font-size: 12px;
    padding: 10px 0;
  }
  .mock-label {
    display: none;
    text-align: center;
    font-family: 'Fredoka', sans-serif;
    font-size: 9px; font-weight: 500;
    color: rgba(0,0,0,0.25);
    letter-spacing: 0.15em; text-transform: uppercase;
    padding: 0 22px 2px;
  }
  body.debug-mode .controls { display: flex; }
  body.debug-mode .mock-label { display: block; }

  /* Connection overlay */
  .conn-overlay {
    position: absolute; inset: 0;
    background: rgba(255,255,255,0.95);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px;
    z-index: 50;
    transition: opacity 0.4s ease;
  }
  .conn-overlay.hidden { opacity: 0; pointer-events: none; }
  .conn-title {
    font-family: 'Fredoka', sans-serif;
    font-weight: 700; font-size: 24px;
    color: #1a1a1a;
  }
  .conn-sub {
    font-family: 'Fredoka', sans-serif;
    font-size: 14px; color: rgba(0,0,0,0.5);
    text-align: center; max-width: 260px;
    line-height: 1.5;
  }
  .conn-btn {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600; font-size: 18px;
    padding: 14px 40px; border-radius: 999px;
    border: none; cursor: pointer;
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    color: #fff;
    box-shadow: 0 6px 0 rgba(37,99,235,0.3);
    transition: transform 0.1s ease;
  }
  .conn-btn:active { transform: scale(0.95); }
  .conn-spinner {
    width: 32px; height: 32px;
    border: 3px solid rgba(0,0,0,0.1);
    border-top-color: #3b82f6;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Error banner */
  .error-banner {
    position: absolute;
    bottom: 100px; left: 22px; right: 22px;
    background: #fee2e2;
    border: 2px solid rgba(220,38,38,0.3);
    border-radius: 16px;
    padding: 12px 16px;
    z-index: 20;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s ease;
    text-align: center;
  }
  .error-banner.visible { opacity: 1; pointer-events: auto; }
  .error-text {
    font-family: 'Fredoka', sans-serif;
    font-size: 13px; color: #dc2626; font-weight: 500;
  }

  /* Reconnect banner */
  .reconnect-banner {
    position: absolute;
    top: 70px; left: 22px; right: 22px;
    background: rgba(251,191,36,0.15);
    border: 1px solid rgba(251,191,36,0.4);
    border-radius: 12px;
    padding: 8px 14px;
    z-index: 20;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s ease;
    text-align: center;
  }
  .reconnect-banner.visible { opacity: 1; }
  .reconnect-text {
    font-family: 'Fredoka', sans-serif;
    font-size: 11px; color: #92400e; font-weight: 500;
  }
</style>
</head>
<body>

<div class="phone" id="phone">
  <div class="scene-bg" id="scene-a"></div>
  <div class="scene-bg" id="scene-b"></div>
  <div class="scene-veil"></div>

  <div class="top-bar">
    <div class="level-chip" id="level-chip">Level 1</div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="conn-dot" id="conn-dot" title="Connection status"></div>
  </div>

  <div class="exercise-info" id="exercise-info">
    <span class="exercise-tag" id="tag-lang">en-US</span>
    <span class="exercise-tag" id="tag-task">letter_name_spelling</span>
  </div>

  <div class="word-wrap">
    <p class="word-hint" id="word-hint">Say this out loud</p>
    <h1 class="word" id="word"></h1>
  </div>

  <div class="kaleido-wrap">
    <div class="kaleido-inner" id="kaleido-inner">
      <canvas id="kaleido" width="800" height="800"></canvas>
      <div class="burst" id="burst"></div>
      <div class="levelup" id="levelup">
        <div>
          <div class="levelup-inner" id="levelup-inner">Level Up!</div>
          <div class="levelup-inner levelup-sub" id="levelup-sub">Next</div>
        </div>
      </div>
    </div>
  </div>

  <div class="mic-area" id="mic-area">
    <button class="mic-btn" id="mic-btn" type="button" aria-label="Start recording">
      <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
    </button>
    <div class="mic-label" id="mic-label">Tap to speak</div>
  </div>

  <div class="result-area">
    <div class="result-card" id="result-card">
      <div class="result-header">
        <span class="result-verdict" id="result-verdict"></span>
        <span class="result-meta" id="result-meta"></span>
      </div>
      <div class="phoneme-row" id="phoneme-row"></div>
    </div>
  </div>

  <div class="mock-label">Mock controls</div>
  <div class="controls" id="mock-controls">
    <button class="btn btn-wrong" id="btn-wrong">&#x2717; Wrong</button>
    <button class="btn btn-lowconf" id="btn-lowconf">? Low</button>
    <button class="btn btn-right" id="btn-right">&#x2713; Right</button>
  </div>

  <!-- Connection overlay -->
  <div class="conn-overlay" id="conn-overlay">
    <div class="conn-title" id="conn-title">Pronunciation Practice</div>
    <div class="conn-sub" id="conn-sub">Connect to the pronunciation engine to begin your session.</div>
    <button class="conn-btn" id="conn-btn">Start Session</button>
    <div class="conn-spinner" id="conn-spinner" style="display:none"></div>
  </div>

  <!-- Reconnect banner -->
  <div class="reconnect-banner" id="reconnect-banner">
    <div class="reconnect-text">Reconnecting&hellip;</div>
  </div>

  <!-- Error banner -->
  <div class="error-banner" id="error-banner">
    <div class="error-text" id="error-text">Connection lost.</div>
    <button class="btn btn-retry" id="btn-retry" style="margin-top:8px;display:inline-block;padding:8px 20px">Retry</button>
  </div>
</div>

<script>
// ============================================================
//  Configuration & exercise definition
// ============================================================
// Production/default: real microphone. Add ?debug=1 for mock controls.
const URL_CONFIG = new URLSearchParams(window.location.search);
const WS_SCHEME = window.location.protocol === 'https:' ? 'wss' : 'ws';
const API_AUTHORITY = URL_CONFIG.get('api') || `${window.location.hostname}:8000`;
const CONFIG = {
  wsUrl: `${WS_SCHEME}://${API_AUTHORITY}/sessions`,
  streamWsUrl: `${WS_SCHEME}://${API_AUTHORITY}/streaming/sessions`,
  useMock: URL_CONFIG.get('debug') === '1',
  confidenceThreshold: 0.6,
  maxProgressUpdatesPerSec: 10,
};
document.body.classList.toggle('debug-mode', CONFIG.useMock);

const EXERCISES = [
  { target:'BIRD',    sentence:'A happy bird can fly',    language:'en-US', task:'sentence_pronunciation', scene:'meadow' },
  { target:'FOLLOW',  sentence:'Follow the little bird',  language:'en-US', task:'sentence_pronunciation', scene:'hills' },
  { target:'FORWARD', sentence:'Take one step forward',   language:'en-US', task:'sentence_pronunciation', scene:'meadow' },
  { target:'HAPPY',   sentence:'The happy bird can sing', language:'en-US', task:'sentence_pronunciation', scene:'hills' },
  { target:'LEARN',   sentence:'We learn a new word',     language:'en-US', task:'sentence_pronunciation', scene:'underwater' },

function patternForWord(word) {
  const key = word.toUpperCase();
  const layerCount = 9;
  if (CURATED[key]) return { word: key, layerCount, ...CURATED[key] };
  const seed = hashStr(word);
  const rand = mulberry32(seed);
  const symmetry = SYMMETRY_POOL[Math.floor(rand() * SYMMETRY_POOL.length)];
  const bg = BG_POOL[Math.floor(rand() * BG_POOL.length)];
  const shuffledPairs = shuffled(rand, COLOR_PAIRS);
  const colors = shuffledPairs.slice(0, layerCount);
  const shapeVocabSize = 2 + Math.floor(rand() * 3);
  const shapeVocab = shuffled(rand, SHAPE_POOL).slice(0, shapeVocabSize);
  const shapes = [];
  for (let i = 0; i < layerCount; i++) shapes.push(shapeVocab[Math.floor(rand() * shapeVocab.length)]);
  return { word: key, bg, symmetry, layerCount, colors, shapes, driftSpeed: 0.005 + rand() * 0.005 };
}

// ============================================================
//  Tokenizer & sentence rendering
// ============================================================
function tokenize(sentence) {
  const tokens = [];
  const re = /([A-Za-z'一-鿿㐀-䶿]+)|([^A-Za-z'一-鿿㐀-䶿]+)/g;
  let m;
  while ((m = re.exec(sentence)) !== null) {
    if (m[1]) tokens.push({ text: m[1], isWord: true });
    else tokens.push({ text: m[2], isWord: false });
  }
  return tokens;
}

function renderSentenceInto(el, sentence) {
  el.innerHTML = '';
  const tokens = tokenize(sentence);
  const wordNodes = [];
  for (const t of tokens) {
    if (t.isWord) {
      const span = document.createElement('span');
      span.className = 'tok';
      span.textContent = t.text;
      el.appendChild(span);
      wordNodes.push(span);
    } else {
      el.appendChild(document.createTextNode(t.text));
    }
  }
  return wordNodes;
}

function setUIState(newState) {
  state.uiState = newState;
  // Connection dot
  connDot.className = 'conn-dot';
  if (['ready','listening','processing','evaluated','low_confidence'].includes(newState)) connDot.classList.add('connected');
  else if (newState === 'connecting') connDot.classList.add('connecting');
  else if (newState === 'error') connDot.classList.add('error');

  // Connection overlay
  connOverlay.classList.toggle('hidden', newState !== 'idle' && newState !== 'connecting');
  connBtn.style.display = newState === 'idle' ? '' : 'none';
  connSpinner.style.display = newState === 'connecting' ? '' : 'none';
  if (newState === 'connecting') {
    connTitle.textContent = 'Connecting…';
    connSub.textContent = 'Establishing session with the pronunciation engine.';
  }

  // Mic button states
  micBtn.className = 'mic-btn';
  micBtn.disabled = !['ready','listening','evaluated','low_confidence'].includes(newState);
  if (newState === 'listening') {
    micBtn.classList.add('listening');
    micBtn.setAttribute('aria-label', 'Stop recording');
    micLabel.textContent = 'Tap to finish';
  } else if (newState === 'processing') {
    micBtn.classList.add('processing');
    micBtn.setAttribute('aria-label', 'Evaluating pronunciation');
    micLabel.textContent = 'Evaluating…';
  } else if (newState === 'ready') {
    micBtn.setAttribute('aria-label', 'Start recording');
    micLabel.textContent = 'Tap to speak';
  } else if (newState === 'evaluated') {
    micBtn.setAttribute('aria-label', 'Record another attempt');
    micLabel.textContent = 'Tap to continue';
  } else if (newState === 'low_confidence') {
    micBtn.setAttribute('aria-label', 'Try recording again');
    micLabel.textContent = 'Try again';
  } else {
    micBtn.setAttribute('aria-label', 'Start recording');
    micLabel.textContent = '';
  }

  // Banners
  errorBanner.classList.toggle('visible', newState === 'error');
  reconnectBanner.classList.toggle('visible', newState === 'disconnected');

  // Hint text
  if (newState === 'listening') wordHint.textContent = 'Listening…';
  else if (newState === 'processing') wordHint.textContent = 'Evaluating…';
  else if (newState === 'low_confidence') wordHint.textContent = 'Try again';
  else wordHint.textContent = 'Say this out loud';
}

// ============================================================
function generateSessionId() {
  return 'sess_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
}

function connectWebSocket() {
  if (CONFIG.useMock) {
    setTimeout(() => {
      setUIState('ready');
      state.sessionId = generateSessionId();
    }, 800);
    return;
  }

  setUIState('connecting');
  if (!state.sessionId) state.sessionId = generateSessionId();

  try {
    state.ws = new WebSocket(`${CONFIG.wsUrl}/${state.sessionId}/events`);
  } catch (e) {
    setUIState('error');
    errorText.textContent = 'Failed to connect.';
    return;
  }

  state.ws.onopen = () => {
    state.reconnectAttempts = 0;
    setUIState('ready');
    reconnectBanner.classList.remove('visible');
  };

  state.ws.onmessage = (evt) => {
    try {
      const data = JSON.parse(evt.data);
      handleServerEvent(data);
    } catch (e) {
      // ignore malformed messages
    }
  };

  state.ws.onclose = () => {
    if (state.uiState !== 'error') {
      setUIState('disconnected');
      scheduleReconnect();
    }
  };

  state.ws.onerror = () => {
    setUIState('error');
    errorText.textContent = 'Connection error.';
  };
}

function scheduleReconnect() {
  if (state.reconnectAttempts >= state.maxReconnectAttempts) {
    setUIState('error');
    errorText.textContent = 'Unable to reconnect. Please retry.';
    return;
  }
  state.reconnectAttempts++;
  const delay = Math.min(1000 * Math.pow(2, state.reconnectAttempts - 1), 16000);
  state.reconnectTimer = setTimeout(() => connectWebSocket(), delay);
}

function disconnectWebSocket() {
  if (state.reconnectTimer) clearTimeout(state.reconnectTimer);
  if (state.ws) { state.ws.onclose = null; state.ws.close(); state.ws = null; }
  stopAudioCapture(false);
  state.sessionId = null;
}

function floatToPcm16(samples) {
  const pcm = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    const value = Math.max(-1, Math.min(1, samples[i]));
    pcm[i] = value < 0 ? Math.round(value * 32768) : Math.round(value * 32767);
  }
  return pcm;
}

function resampleTo16k(input, inputRate) {
  if (inputRate === 16000) return Array.from(input);
  const outputLength = Math.floor(input.length * 16000 / inputRate);
  const output = new Array(outputLength);
  const ratio = inputRate / 16000;
  for (let index = 0; index < outputLength; index++) {
    const position = index * ratio;
    const left = Math.floor(position);
    const right = Math.min(left + 1, input.length - 1);
    const fraction = position - left;
    output[index] = input[left] * (1 - fraction) + input[right] * fraction;
  }
  return output;
}

async function beginAudioCapture() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    throw new Error('Microphone capture is unavailable in this browser.');
  }
  state.mediaStream = await navigator.mediaDevices.getUserMedia({
    audio: {
      channelCount: 1,
      echoCancellation: false,
      noiseSuppression: false,
      autoGainControl: false,
    },
  });
  state.audioContext = new AudioContext({ sampleRate: 16000 });
  state.audioSource = state.audioContext.createMediaStreamSource(state.mediaStream);
  state.audioProcessor = state.audioContext.createScriptProcessor(4096, 1, 1);
  state.pcmBuffer = [];
  state.audioProcessor.onaudioprocess = (event) => {
    if (!state.streamWs || state.streamWs.readyState !== WebSocket.OPEN) return;
    const mono = event.inputBuffer.getChannelData(0);
    let energy = 0;
    for (let index = 0; index < mono.length; index++) energy += mono[index] * mono[index];
    const rms = Math.sqrt(energy / Math.max(mono.length, 1));
    state.voiceLevel = state.voiceLevel * 0.55 + Math.min(rms / 0.12, 1) * 0.45;
    const voiceVisible = state.voiceLevel > 0.08;
    micBtn.classList.toggle('hearing', voiceVisible);
    micBtn.style.setProperty('--voice-scale', (1 + state.voiceLevel * 0.18).toFixed(3));
    micBtn.style.setProperty('--voice-ring', `${Math.round(7 + state.voiceLevel * 20)}px`);
    micLabel.textContent = voiceVisible ? 'Voice detected' : 'Listening…';
    state.pcmBuffer.push(...resampleTo16k(mono, state.audioContext.sampleRate));
    while (state.pcmBuffer.length >= 640) {
      const frame = state.pcmBuffer.splice(0, 640);
      state.streamWs.send(floatToPcm16(frame).buffer);
    }
  };
  state.audioSource.connect(state.audioProcessor);
  state.audioProcessor.connect(state.audioContext.destination);
}

function releaseAudioResources() {
  if (state.audioProcessor) {
    state.audioProcessor.disconnect();
    state.audioProcessor.onaudioprocess = null;
  }
  if (state.audioSource) state.audioSource.disconnect();
  if (state.mediaStream) {
    for (const track of state.mediaStream.getTracks()) track.stop();
  }
  if (state.audioContext) state.audioContext.close();
  state.audioProcessor = null;
  state.audioSource = null;
  state.mediaStream = null;
  state.audioContext = null;
  state.pcmBuffer = [];
  state.voiceLevel = 0;
  micBtn.classList.remove('hearing');
  micBtn.style.removeProperty('--voice-scale');
  micBtn.style.removeProperty('--voice-ring');
}

function stopAudioCapture(sendFinish = true) {
  releaseAudioResources();
  if (state.streamWs && state.streamWs.readyState === WebSocket.OPEN && sendFinish) {
    state.streamWs.send(JSON.stringify({ type: 'session.finish' }));
  } else if (state.streamWs && !sendFinish) {
    state.streamWs.onclose = null;
    state.streamWs.close();
    state.streamWs = null;
  }
}

async function startRealAttempt() {
  const exercise = EXERCISES[state.exerciseIdx];
  state.streamWs = new WebSocket(`${CONFIG.streamWsUrl}/${state.sessionId}`);
  state.streamWs.binaryType = 'arraybuffer';
  state.streamWs.onmessage = (event) => {
    let data;
    try { data = JSON.parse(event.data); } catch (_) { return; }
    if (data.type === 'session.prompt') {
      beginAudioCapture().catch((error) => {
        releaseAudioResources();
        setUIState('error');
        errorText.textContent = error.message || 'Microphone permission denied.';
      });
    } else if (data.type === 'stream.inference.partial') {
      if (data.voice_activity) {
        state.speechDetected = true;
        state.silentFrameCount = 0;
      } else if (state.speechDetected) {
        state.silentFrameCount++;
      }
      handleServerEvent({
        type: 'pronunciation.progress',
        version: 1,
        sequence: data.sequence,
        voice_activity: data.voice_activity,
      });
      if (Array.isArray(data.word_updates)) {
        for (const update of data.word_updates) enqueueWordResult(update);
      }
      if (
        state.uiState === 'listening'
        && state.speechDetected
        && state.silentFrameCount >= 40
      ) {
        setUIState('processing');
        stopAudioCapture(true);
      }
    } else if (data.type === 'pronunciation.evaluated') {
      handleServerEvent(data);
    } else if (data.type === 'stream.error') {
      setUIState('error');
      errorText.textContent = data.message || 'Audio stream error.';
    }
  };
  state.streamWs.onopen = () => {
    state.speechDetected = false;
    state.silentFrameCount = 0;
    state.streamWs.send(JSON.stringify({
      type: 'session.start',
      target_words: [exercise.target.toLowerCase()],
      expected_text: exercise.sentence,
      locale: exercise.language,
    }));
  };
  state.streamWs.onclose = () => {
    state.streamWs = null;
    releaseAudioResources();
  };
  state.streamWs.onerror = () => {
    setUIState('error');
    errorText.textContent = 'Audio stream connection error.';
  };
}

// ============================================================
//  Server event handling
// ============================================================
function handleServerEvent(data) {
  if (!data || !data.type || data.version === undefined) return;

  if (data.type === 'pronunciation.progress') {
    const now = performance.now();
    if (now - state.lastProgressTime < 1000 / CONFIG.maxProgressUpdatesPerSec) return;
    state.lastProgressTime = now;
    if (state.uiState !== 'listening') setUIState('listening');
    return;
  }

  if (data.type === 'pronunciation.evaluated') {
    if (state.seenAttemptIds.has(data.attempt_id)) return;
    state.seenAttemptIds.add(data.attempt_id);
    state.lastAttemptId = data.attempt_id;

    if (['RETRY','UNDECIDABLE','REVIEW_REQUIRED'].includes(data.status)) {
      handleLowConfidence(data);
    } else if (data.status === 'CORRECT') {
      handleCorrect(data);
    } else if (data.status === 'INCORRECT') {
      handleIncorrect(data);
    } else if (data.confidence !== null && data.confidence < CONFIG.confidenceThreshold) {
      handleLowConfidence(data);
    } else if (data.score !== null && data.score >= 0.7) {
      handleCorrect(data);
    } else {
      handleIncorrect(data);
    }
    return;
  }

  // Safely ignore unknown event types
}

// ============================================================
//  Evaluation handlers
// ============================================================
function handleCorrect(data) {
  setUIState('evaluated');
  if (Array.isArray(data.words) && data.words.length) {
    playSentenceWordResults(data.words, true);
    showResult('correct', data);
    return;
  }
  if (data.result && data.result.mode === 'sentence_pronunciation') {
    state.readIdx = state.wordNodes.length - 1;
    state.targetLayers = currentCfg().layerCount;
    for (const node of state.wordNodes) {
      node.classList.add('read');
      node.classList.remove('current', 'failed', 'low-conf');
    }
    state.pulse = 1;
    startLevelUp();
  } else {
    onRight();
  }
  showResult('correct', data);
}

function handleIncorrect(data) {
  setUIState('evaluated');
  if (Array.isArray(data.words) && data.words.length) {
    playSentenceWordResults(data.words, false);
    showResult('incorrect', data);
    return;
  }
  onWrong();
  showResult('incorrect', data);
}

function playSentenceWordResults(results, sentenceCorrect) {
  results.forEach((result, step) => {
    setTimeout(() => {
      applyWordResult(result);
      if (step === results.length - 1) {
        const index = Number.isInteger(result.index) ? result.index : step;
        const node = state.wordNodes[index];
        if (!node) return;
        node.classList.remove('current');
        if (sentenceCorrect) {
          state.targetLayers = currentCfg().layerCount;
          startLevelUp();
        }
      }
    }, step * 320);
  });
}

function applyWordResult(result) {
  const index = Number.isInteger(result.index) ? result.index : -1;
  const node = state.wordNodes[index];
  if (!node || node.dataset.evaluated === result.status) return;
  node.dataset.evaluated = result.status;
  state.readIdx = index;
  for (const item of state.wordNodes) item.classList.remove('current');
  node.classList.add('current');
  const perWord = currentCfg().layerCount / Math.max(state.wordNodes.length, 1);
  if (result.status === 'CORRECT') {
    node.classList.add('read');
    node.classList.remove('failed', 'low-conf');
    state.targetLayers = Math.min(currentCfg().layerCount, state.targetLayers + perWord);
    state.pulse = 1;
  } else if (result.status === 'INCORRECT') {
    node.classList.remove('read');
    node.classList.add('failed');
    state.targetLayers = Math.max(1, state.targetLayers - perWord);
    state.wrong = 1;
  } else {
    node.classList.add('low-conf');
  }
}

function enqueueWordResult(result) {
  state.wordUpdateQueue.push(result);
  if (state.wordUpdateTimer !== null) return;
  const advance = () => {
    const next = state.wordUpdateQueue.shift();
    if (!next) {
      state.wordUpdateTimer = null;
      return;
    }
    applyWordResult(next);
    state.wordUpdateTimer = setTimeout(advance, 360);
  };
  advance();
}

function handleLowConfidence(data) {
  setUIState('low_confidence');
  if (Array.isArray(data.words) && data.words.length) {
    playSentenceWordResults(data.words, false);
  }
  const n = state.wordNodes.length;
  if (state.readIdx >= 0 && state.readIdx < n) {
    const el = state.wordNodes[state.readIdx];
    el.classList.remove('low-conf');
    void el.offsetWidth;
    el.classList.add('low-conf');
  }
  showResult('low-conf', data);
}

// ============================================================
//  Result display
// ============================================================
function showResult(type, data) {
  resultCard.classList.add('visible');
  resultVerdict.className = 'result-verdict ' + type;

  const reasons = Array.isArray(data.reason_codes) ? data.reason_codes : [];
  if (type === 'correct') {
    resultVerdict.textContent = 'Correct!';
  } else if (type === 'incorrect' && reasons.includes('WRONG_WORD')) {
    resultVerdict.textContent = 'Different word heard. Try again.';
  } else if (type === 'incorrect') {
    resultVerdict.textContent = 'Try again';
  } else if (reasons.includes('PHONETIC_BACKEND_DISABLED')) {
    resultVerdict.textContent = 'Word recognized — pronunciation check unavailable.';
  } else if (reasons.includes('PHONETIC_BACKEND_REQUIRED')) {
    resultVerdict.textContent = 'Word heard — phonetic scoring unavailable.';
  } else if (reasons.includes('AUDIO_INSUFFICIENT')) {
    resultVerdict.textContent = 'No clear speech heard. Try again.';
  } else {
    resultVerdict.textContent = 'Not clear enough. Try again.';
  }

  const metaParts = [];
  if (data.score !== null && data.score !== undefined) metaParts.push('score: ' + (data.score * 100).toFixed(0) + '%');
  if (data.confidence !== null && data.confidence !== undefined) metaParts.push('conf: ' + (data.confidence * 100).toFixed(0) + '%');
  if (data.recognized_word) metaParts.push('heard: ' + data.recognized_word);
  if (data.engine_version) metaParts.push(data.engine_version);
  resultMeta.textContent = metaParts.join(' · ');

  phonemeRow.innerHTML = '';

  // English phonemes
  if (data.expected_phonemes && data.detected_phonemes) {
    const maxLen = Math.max(data.expected_phonemes.length, data.detected_phonemes.length);
    for (let i = 0; i < maxLen; i++) {
      const exp = data.expected_phonemes[i] || '—';
      const det = data.detected_phonemes[i] || '—';
      const match = exp === det;
      const cell = document.createElement('span');
      cell.className = 'phoneme-cell ' + (match ? 'match' : 'mismatch');
      cell.textContent = det;
      cell.title = 'expected: ' + exp;
      phonemeRow.appendChild(cell);
    }
  }

  // Chinese units (segmental + tone)
  if (data.units) {
    for (const unit of data.units) {
      const cell = document.createElement('span');
      const segOk = unit.segmental_correct !== false;
      const toneOk = unit.tone_correct !== false;
      cell.className = 'phoneme-cell ' + (segOk && toneOk ? 'match' : 'mismatch');
      cell.textContent = unit.observed || unit.expected || '?';
      if (unit.expected_tone !== undefined) {
        const tl = document.createElement('span');
        tl.className = 'tone-label' + (toneOk ? '' : ' wrong-tone');
        tl.textContent = toneOk ? 'T' + unit.expected_tone : 'T' + unit.observed_tone + '→T' + unit.expected_tone;
        cell.appendChild(tl);
      }
      phonemeRow.appendChild(cell);
    }
  }
}

function hideResult() {
  resultCard.classList.remove('visible');
}

// ============================================================
//  Kaleidoscope growth (from V4)
// ============================================================
function onRight() {
  if (state.transitioning) return;
  const cfg = currentCfg();
  const n = state.wordNodes.length;
  if (n === 0) return;
  const perWord = cfg.layerCount / n;
  const nextIdx = state.readIdx + 1;
  if (nextIdx >= n) {
    state.readIdx = n - 1;
    state.targetLayers = cfg.layerCount;
    for (let i = 0; i < n; i++) {
      state.wordNodes[i].classList.add('read');
      state.wordNodes[i].classList.remove('failed');
    }
    startLevelUp();
    return;
  }
  state.readIdx = nextIdx;
  state.targetLayers = Math.min(cfg.layerCount, state.targetLayers + perWord);
  state.pulse = 1;
  for (let i = 0; i < n; i++) {
    const el = state.wordNodes[i];
    el.classList.toggle('current', i === state.readIdx);
    el.classList.toggle('read', i < state.readIdx);
    if (i <= state.readIdx) el.classList.remove('failed');
  }
}

function onWrong() {
  if (state.transitioning) return;
  const cfg = currentCfg();
  const n = state.wordNodes.length;
  const perWord = n > 0 ? cfg.layerCount / n : 1;
  if (state.readIdx >= 0 && state.readIdx < n) {
    const failedEl = state.wordNodes[state.readIdx];
    failedEl.classList.remove('failed');
    void failedEl.offsetWidth;
    failedEl.classList.add('failed');
  }
  state.readIdx = Math.max(-1, state.readIdx - 1);
  state.targetLayers = Math.max(1, state.targetLayers - perWord);
  state.wrong = 1;
  for (let i = 0; i < n; i++) {
    const el = state.wordNodes[i];
    el.classList.toggle('current', i === state.readIdx);
    el.classList.toggle('read', i < state.readIdx);
  }
}

function updateProgressBar() {
  const cfg = currentCfg();
  const pct = Math.max(0, Math.min(100, (state.animProgress / cfg.layerCount) * 100));
  progressFill.style.width = pct + '%';
}

// ============================================================
//  Level Up (from V4)
// ============================================================
function startLevelUp() {
  state.transitioning = true;
  state.transitionStartTime = performance.now();
  btnRight.disabled = true;
  btnWrong.disabled = true;
  btnLowConf.disabled = true;
  spawnConfetti();
}

function tickTransition(now) {
  const dt = now - state.transitionStartTime;
  if (dt < 600) {
    const t = dt / 600;
    state.spinBoost = t * 0.35;
    state.zoom = 1 + t * 0.4;
    burstEl.style.opacity = (t * 0.3).toFixed(2);
  } else if (dt < 1000) {
    const t = (dt - 600) / 400;
    state.spinBoost = 0.35 * (1 - t) + 0.05;
    state.zoom = 1.4 + Math.sin(t * Math.PI) * 0.15;
    burstEl.style.opacity = (0.3 + t * 0.7).toFixed(2);
    if (dt >= 800 && !levelupEl.classList.contains('show')) {
      const nextEx = EXERCISES[(state.exerciseIdx + 1) % EXERCISES.length];
      levelupSub.textContent = 'Level ' + ((state.exerciseIdx + 1) % EXERCISES.length + 1) + ' · ' + nextEx.target;
      levelupEl.classList.add('show');
    }
  } else if (dt < 1000 + 16) {
    if (!state._swapped) {
      state._swapped = true;
      setExercise(state.exerciseIdx + 1);
      state.targetLayers = 1;
      state.animProgress = 1;
      state.pulse = 0;
      state.wrong = 0;
    }
  } else if (dt < 1800) {
    const t = (dt - 1000) / 800;
    state.spinBoost = 0.15 * (1 - t);
    state.zoom = 1.55 - t * 0.55;
    burstEl.style.opacity = (1 - t).toFixed(2);
    if (dt > 1400) levelupEl.classList.remove('show');
  } else {
    state.spinBoost = 0;
    state.zoom = 1;
    burstEl.style.opacity = '0';
    levelupEl.classList.remove('show');
    state._swapped = false;
    state.transitioning = false;
    btnRight.disabled = false;
    btnWrong.disabled = false;
    btnLowConf.disabled = false;
  }
}

function spawnConfetti() {
  const wrap = kaleidoInner;
  const colors = ['#fbbf24','#ef4444','#22c55e','#3b82f6','#a855f7','#f97316','#ec4899'];
  for (let i = 0; i < 26; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.background = colors[i % colors.length];
    piece.style.left = '50%';
    piece.style.top = '50%';
    piece.style.transform = 'translate(-50%,-50%)';
    wrap.appendChild(piece);
    const angle = (i / 26) * Math.PI * 2 + Math.random() * 0.3;
    const dist = 180 + Math.random() * 120;
    const dx = Math.cos(angle) * dist;
    const dy = Math.sin(angle) * dist;
    const rot = Math.random() * 720 - 360;
    piece.animate([
      { transform: 'translate(-50%,-50%) translate(0,0) rotate(0deg)', opacity: 1 },
      { transform: `translate(-50%,-50%) translate(${dx}px, ${dy}px) rotate(${rot}deg)`, opacity: 0 }
    ], { duration: 1400, easing: 'cubic-bezier(.2,.7,.3,1)', fill: 'forwards' });
    setTimeout(() => piece.remove(), 1500);
  }
}

// ============================================================
//  Render loop (from V4)
// ============================================================
function loop() {
  requestAnimationFrame(loop);
  const now = performance.now();
  state.lastFrameTime = now;
  state.rotation += 0.008 + state.spinBoost;

  if (state.transitioning) tickTransition(now);

  const cfg = currentCfg();
  if (state.pulse > 0) state.pulse = Math.max(0, state.pulse - 0.02);
  if (state.wrong > 0) state.wrong = Math.max(0, state.wrong - 0.015);
  const diff = state.targetLayers - state.animProgress;
  if (Math.abs(diff) > 0.01) state.animProgress += diff * 0.06;
  else state.animProgress = state.targetLayers;

  drawKaleido();

  const t = Math.max(0, Math.min(1, (state.animProgress - 1) / (cfg.layerCount - 1)));
  const sat = 0.15 + 0.85 * t;
  const brightness = state.transitioning ? 1 + (state.zoom - 1) * 0.4 : 1;
  canvas.style.filter = `saturate(${sat.toFixed(2)}) brightness(${brightness.toFixed(2)})`;
  canvas.style.transform = `scale(${state.zoom.toFixed(3)})`;
  canvas.style.transformOrigin = 'center';
  updateProgressBar();
}

function drawKaleido() {
  const cfg = currentCfg();
  const W = 800, H = 800, cx = W/2, cy = H/2;
  ctx.clearRect(0,0,W,H);
  const N = cfg.symmetry;
  const sliceAngle = (Math.PI*2)/N;
  const maxR = 355;
  const bandSize = maxR / cfg.layerCount;
  const progress = state.animProgress;
  const pulse = state.pulse;
  const wrong = state.wrong;
  ctx.save();
  ctx.translate(cx, cy);
  for (let layer = 0; layer < Math.min(Math.ceil(progress), cfg.layerCount); layer++) {
    const layerProgress = Math.min(1, progress - layer);
    if (layerProgress <= 0) break;
    const rMin = layer * bandSize * layerProgress;
    const rMax = (layer + 1) * bandSize * layerProgress;
    const [c1, c2] = cfg.colors[layer % cfg.colors.length];
    const shapeSet = cfg.shapes[layer % cfg.shapes.length];
    const alpha = layerProgress * (wrong > 0 && layer >= Math.floor(progress) ? (1 - wrong * 0.5) : 1);
    ctx.globalAlpha = alpha * 0.88;
    for (let seg = 0; seg < N; seg++) {
      ctx.save();
      ctx.rotate(seg * sliceAngle + state.rotation * 0.15);
      for (let mirror = 0; mirror < 2; mirror++) {
        ctx.save();
        if (mirror === 1) ctx.scale(-1, 1);
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(760, 0);
        ctx.arc(0, 0, 760, 0, sliceAngle / 2);
        ctx.closePath();
        ctx.clip();
        const drift = state.rotation * (cfg.driftSpeed / 0.008) * (0.3 + layer * 0.12);
        const pulseExtra = pulse * 12 * (layer === Math.ceil(progress) - 1 ? 1 : 0);
        const band = rMax - rMin + pulseExtra;
        const dX = Math.sin(drift) * band * 0.2;
        const dY = Math.cos(drift * 1.3) * band * 0.12;
        const dS = 1 + Math.sin(drift * 0.7) * 0.06;
        const dA = Math.sin(drift * 0.5) * 0.1;
        ctx.save();
        ctx.translate(dX, dY);
        ctx.rotate(dA);
        ctx.scale(dS, dS);
        drawDenseShapes(shapeSet, layer, rMin, rMax, c1, c2, sliceAngle / 2);
        ctx.restore();
        ctx.restore();
        ctx.restore();
      }
      ctx.restore();
    }
  }
  ctx.restore();
  if (wrong > 0) {
    ctx.save();
    ctx.globalAlpha = wrong;
    const rHalo = 400;
    const grad = ctx.createRadialGradient(cx, cy, 40, cx, cy, rHalo);
    grad.addColorStop(0,   'rgba(239,68,68,0.35)');
    grad.addColorStop(0.55,'rgba(239,68,68,0.18)');
    grad.addColorStop(1,   'rgba(239,68,68,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, rHalo, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function drawDenseShapes(shapeSet, layer, rMin, rMax, c1, c2, sa) {
  const rMid = (rMin + rMax) / 2;
  const band = rMax - rMin;
  switch (shapeSet) {
    case 'petal': {
      ctx.beginPath();
      ctx.moveTo(rMin, 0);
      ctx.quadraticCurveTo(rMid, rMid * Math.sin(sa * 0.7), rMax * Math.cos(sa * 0.4), rMax * Math.sin(sa * 0.4));
      ctx.lineTo(rMax * Math.cos(sa * 0.2), rMax * Math.sin(sa * 0.2));
      ctx.quadraticCurveTo(rMid * 0.8, rMid * Math.sin(sa * 0.1), rMin, 0);
      ctx.fillStyle = c1; ctx.fill();
      ctx.beginPath();
      ctx.moveTo(rMin * 1.1, 0);
      ctx.quadraticCurveTo(rMid, -band * 0.08, rMax, 0);
      ctx.quadraticCurveTo(rMid, band * 0.15, rMin * 1.1, 0);
      ctx.fillStyle = c2; ctx.fill();
      ctx.beginPath();
      ctx.arc(rMax * 0.85 * Math.cos(sa * 0.1), rMax * 0.85 * Math.sin(sa * 0.1), band * 0.1, 0, Math.PI * 2);
      ctx.fillStyle = c2; ctx.fill();
      break;
    }
    case 'dot': {
      const spots = [
        [rMid, 0, 0.28], [rMid * 0.9, sa * 0.3, 0.22], [rMax * 0.85, sa * 0.15, 0.18],
        [rMin * 1.4, sa * 0.15, 0.15], [rMax * 0.7, sa * 0.4, 0.12], [rMid * 1.1, sa * 0.05, 0.14],
      ];
      for (let i = 0; i < spots.length; i++) {
        ctx.beginPath();
        ctx.arc(spots[i][0] * Math.cos(spots[i][1]), spots[i][0] * Math.sin(spots[i][1]), band * spots[i][2], 0, Math.PI * 2);
        ctx.fillStyle = i % 2 === 0 ? c1 : c2; ctx.fill();
      }
      break;
    }
    case 'wedge': {
      ctx.beginPath();
      ctx.moveTo(rMin, 0);
      ctx.lineTo(rMax, 0);
      ctx.lineTo(rMax * Math.cos(sa * 0.45), rMax * Math.sin(sa * 0.45));
      ctx.lineTo(rMin * Math.cos(sa * 0.45), rMin * Math.sin(sa * 0.45));
      ctx.closePath();
      ctx.fillStyle = c1; ctx.fill();
      const a1 = sa * 0.15, a2 = sa * 0.3;
      ctx.beginPath();
      ctx.moveTo(rMid * 0.85, 0);
      ctx.lineTo(rMid * Math.cos(a1), rMid * Math.sin(a2));
      ctx.lineTo(rMax * 0.9 * Math.cos(a1), rMax * 0.9 * Math.sin(a1));
      ctx.lineTo(rMid * Math.cos(a1), 0);
      ctx.closePath();
      ctx.fillStyle = c2; ctx.fill();
      break;
    }
    case 'bubble': {
      const bubbles = [
        [rMid, sa * 0.18, 0.35], [rMax * 0.8, sa * 0.05, 0.25], [rMin * 1.5, sa * 0.35, 0.22],
        [rMax * 0.65, sa * 0.35, 0.18], [rMid * 1.2, sa * 0.02, 0.2], [rMax * 0.9, sa * 0.25, 0.15],
      ];
      for (let i = 0; i < bubbles.length; i++) {
        ctx.beginPath();
        ctx.arc(bubbles[i][0] * Math.cos(bubbles[i][1]), bubbles[i][0] * Math.sin(bubbles[i][1]), band * bubbles[i][2], 0, Math.PI * 2);
        ctx.fillStyle = i % 3 === 0 ? c1 : c2;
        ctx.globalAlpha = 0.7 + (i % 3) * 0.1;
        ctx.fill();
      }
      ctx.globalAlpha = 0.88;
      break;
    }
    case 'fin': {
      ctx.beginPath();
      ctx.moveTo(rMin, 0);
      ctx.quadraticCurveTo(rMax * 1.05, band * 0.4, rMax * Math.cos(sa * 0.45), rMax * Math.sin(sa * 0.45));
      ctx.lineTo(rMin * Math.cos(sa * 0.3), rMin * Math.sin(sa * 0.3));
      ctx.closePath();
      ctx.fillStyle = c1; ctx.fill();
      ctx.beginPath();
      ctx.moveTo(rMid * 0.8, 0);
      ctx.quadraticCurveTo(rMax * 0.8, band * 0.15, rMax * 0.85 * Math.cos(sa * 0.2), rMax * 0.85 * Math.sin(sa * 0.2));
      ctx.lineTo(rMid * 0.7 * Math.cos(sa * 0.1), rMid * 0.7 * Math.sin(sa * 0.1));
      ctx.closePath();
      ctx.fillStyle = c2; ctx.fill();
      break;
    }
    case 'gem': {
      const r = band * 0.42;
      const gcx = rMid, gcy = rMid * Math.sin(sa * 0.2);
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * Math.PI * 2;
        const px = gcx + Math.cos(a) * r;
        const py = gcy + Math.sin(a) * r * 0.8;
        i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fillStyle = c1; ctx.fill();
      const r2 = band * 0.22;
      const gcx2 = rMax * 0.8, gcy2 = 0;
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * Math.PI * 2 + Math.PI / 6;
        ctx.lineTo(gcx2 + Math.cos(a) * r2, gcy2 + Math.sin(a) * r2 * 0.8);
      }
      ctx.closePath();
      ctx.fillStyle = c2; ctx.fill();
      ctx.beginPath();
      ctx.moveTo(rMax * 0.9, rMax * Math.sin(sa * 0.15));
      ctx.lineTo(rMax * 0.95 * Math.cos(sa * 0.2), rMax * 0.95 * Math.sin(sa * 0.25));
      ctx.lineTo(rMax * Math.cos(sa * 0.15), rMax * Math.sin(sa * 0.35));
      ctx.closePath();
      ctx.fillStyle = c1; ctx.globalAlpha = 0.6; ctx.fill(); ctx.globalAlpha = 0.88;
      break;
    }
    case 'leaf': {
      ctx.save();
      ctx.translate(rMid, rMid * Math.sin(sa * 0.2));
      ctx.rotate(sa * 0.2);
      ctx.beginPath();
      ctx.ellipse(0, 0, band * 0.5, band * 0.25, 0, 0, Math.PI * 2);
      ctx.fillStyle = c1; ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-band * 0.45, 0); ctx.lineTo(band * 0.45, 0);
      ctx.lineWidth = 1.5; ctx.strokeStyle = c2; ctx.stroke();
      ctx.restore();
      ctx.save();
      ctx.translate(rMax * 0.8, 0);
      ctx.beginPath();
      ctx.ellipse(0, 0, band * 0.3, band * 0.15, -sa * 0.1, 0, Math.PI * 2);
      ctx.fillStyle = c2; ctx.fill();
      ctx.restore();
      ctx.beginPath();
      ctx.arc(rMin * 1.3 * Math.cos(sa * 0.35), rMin * 1.3 * Math.sin(sa * 0.35), band * 0.1, 0, Math.PI * 2);
      ctx.fillStyle = c1; ctx.fill();
      break;
    }
    case 'branch': {
      ctx.beginPath();
      ctx.moveTo(rMin, -band * 0.06);
      ctx.lineTo(rMid, -band * 0.04);
      ctx.lineTo(rMax, band * 0.12);
      ctx.lineTo(rMax, band * 0.2);
      ctx.lineTo(rMid, band * 0.04);
      ctx.lineTo(rMin, band * 0.06);
      ctx.closePath();
      ctx.fillStyle = c1; ctx.fill();
      ctx.beginPath();
      ctx.moveTo(rMid, 0);
      ctx.lineTo(rMax * Math.cos(sa * 0.35), rMax * Math.sin(sa * 0.35));
      ctx.lineTo(rMax * Math.cos(sa * 0.4), rMax * Math.sin(sa * 0.4));
      ctx.lineTo(rMid * 1.05, band * 0.05);
      ctx.closePath();
      ctx.fillStyle = c1; ctx.fill();
      ctx.beginPath();
      ctx.arc(rMax, band * 0.16, 6, 0, Math.PI * 2);
      ctx.fillStyle = c2; ctx.fill();
      ctx.beginPath();
      ctx.arc(rMax * Math.cos(sa * 0.37), rMax * Math.sin(sa * 0.37), 6, 0, Math.PI * 2);
      ctx.fillStyle = c2; ctx.fill();
      break;
    }
    case 'cloud': {
      const cx1 = rMid, cy1 = rMid * Math.sin(sa * 0.15);
      ctx.beginPath();
      ctx.arc(cx1, cy1, band * 0.3, 0, Math.PI * 2);
      ctx.fillStyle = c1; ctx.fill();
      ctx.beginPath();
      ctx.arc(cx1 + band * 0.2, cy1 - band * 0.05, band * 0.25, 0, Math.PI * 2);
      ctx.fillStyle = c2; ctx.fill();
      ctx.beginPath();
      ctx.arc(cx1 - band * 0.15, cy1 + band * 0.1, band * 0.22, 0, Math.PI * 2);
      ctx.fillStyle = c2; ctx.fill();
      ctx.beginPath();
      ctx.arc(cx1 + band * 0.05, cy1 + band * 0.2, band * 0.2, 0, Math.PI * 2);
      ctx.fillStyle = c1; ctx.globalAlpha = 0.7; ctx.fill(); ctx.globalAlpha = 0.88;
      ctx.beginPath();
      ctx.arc(rMax * 0.8, 0, band * 0.18, 0, Math.PI * 2);
      ctx.fillStyle = c1; ctx.fill();
      break;
    }
  }
}

// ============================================================
//  Mock adapter — simulates server events
// ============================================================
const MOCK = {
  correctEnglish() {
    return {
      type: 'pronunciation.evaluated', version: 1,
      attempt_id: Date.now(),
      phase: 'evaluated',
      expected_word: EXERCISES[state.exerciseIdx].target.toLowerCase(),
      expected_phonemes: ['k','æ','t'],
      detected_phonemes: ['k','æ','t'],
      confidence: 0.92,
      score: 0.95,
      benchmark_version: '1.0.0',
      engine_version: 'mock-v1',
    };
  },
  incorrectEnglish() {
    return {
      type: 'pronunciation.evaluated', version: 1,
      attempt_id: Date.now(),
      phase: 'evaluated',
      expected_word: EXERCISES[state.exerciseIdx].target.toLowerCase(),
      expected_phonemes: ['k','æ','t'],
      detected_phonemes: ['k','ɛ','t'],
      confidence: 0.88,
      score: 0.45,
      benchmark_version: '1.0.0',
      engine_version: 'mock-v1',
    };
  },
  lowConfidence() {
    return {
      type: 'pronunciation.evaluated', version: 1,
      attempt_id: Date.now(),
      phase: 'evaluated',
      expected_word: EXERCISES[state.exerciseIdx].target.toLowerCase(),
      expected_phonemes: ['k','æ','t'],
      detected_phonemes: ['k','?'],
      confidence: 0.3,
      score: null,
      benchmark_version: '1.0.0',
      engine_version: 'mock-v1',
    };
  },
  chineseToneError() {
    return {
      type: 'pronunciation.evaluated', version: 1,
      attempt_id: Date.now(),
      phase: 'evaluated',
      expected_word: '你好',
      confidence: 0.91,
      score: 0.6,
      benchmark_version: '1.0.0',
      engine_version: 'mock-v1',
      units: [
        { expected: 'nǐ', observed: 'ní', segmental_correct: true, tone_correct: false, expected_tone: 3, observed_tone: 2, correct: false, confidence: 0.91 },
        { expected: 'hǎo', observed: 'hǎo', segmental_correct: true, tone_correct: true, expected_tone: 3, observed_tone: 3, correct: true, confidence: 0.95 },
      ],
    };
  },
};

// ============================================================
//  Event wiring
// ============================================================
connBtn.addEventListener('click', () => {
  connectWebSocket();
});

btnRetry.addEventListener('click', () => {
  hideResult();
  disconnectWebSocket();
  state.reconnectAttempts = 0;
  connectWebSocket();
});

micBtn.addEventListener('click', async () => {
  if (state.uiState === 'ready' || state.uiState === 'evaluated' || state.uiState === 'low_confidence') {
    hideResult();
    for (const node of state.wordNodes) {
      delete node.dataset.evaluated;
      node.classList.remove('current', 'read', 'failed', 'low-conf');
    }
    state.wordUpdateQueue = [];
    if (state.wordUpdateTimer !== null) {
      clearTimeout(state.wordUpdateTimer);
      state.wordUpdateTimer = null;
    }
    state.readIdx = -1;
    state.targetLayers = 1;
    state.animProgress = 1;
    state.pulse = 0;
    state.wrong = 0;
    setUIState('listening');
    if (!CONFIG.useMock) {
      try {
        await startRealAttempt();
      } catch (error) {
        setUIState('error');
        errorText.textContent = error.message || 'Unable to start microphone.';
      }
    }
  } else if (state.uiState === 'listening') {
    setUIState('processing');
    if (!CONFIG.useMock) stopAudioCapture(true);
  }
});

btnRight.addEventListener('click', () => {
  if (!CONFIG.useMock) return;
  handleServerEvent(MOCK.correctEnglish());
});
btnWrong.addEventListener('click', () => {
  if (!CONFIG.useMock) return;
  handleServerEvent(MOCK.incorrectEnglish());
});
btnLowConf.addEventListener('click', () => {
  if (!CONFIG.useMock) return;
  handleServerEvent(MOCK.lowConfidence());
});

document.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  if (CONFIG.useMock) {
    if (e.key === 'ArrowRight' || e.key === 'r' || e.key === 'R') handleServerEvent(MOCK.correctEnglish());
    if (e.key === 'ArrowLeft'  || e.key === 'w' || e.key === 'W') handleServerEvent(MOCK.incorrectEnglish());
    if (e.key === 'l' || e.key === 'L') handleServerEvent(MOCK.lowConfidence());
    if (e.key === 'c' || e.key === 'C') handleServerEvent(MOCK.chineseToneError());
  }
});

// ============================================================
//  Init
// ============================================================
setExercise(0);
if (CONFIG.useMock) {
  setUIState('ready');
  state.sessionId = generateSessionId();
} else {
  setUIState('idle');
}
requestAnimationFrame(loop);
</script>
