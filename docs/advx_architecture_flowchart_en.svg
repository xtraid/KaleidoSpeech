<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF2FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7C3AED"/>
    </marker>
    <style>
      .title { font: 700 34px Inter, Arial, sans-serif; fill: #0F172A; }
      .subtitle { font: 400 17px Inter, Arial, sans-serif; fill: #475569; }
      .lane { font: 700 14px Inter, Arial, sans-serif; letter-spacing: 1.5px; fill: #64748B; }
      .nodeTitle { font: 700 18px Inter, Arial, sans-serif; fill: #0F172A; }
      .nodeText { font: 400 14px Inter, Arial, sans-serif; fill: #475569; }
      .small { font: 600 12px Inter, Arial, sans-serif; fill: #64748B; }
      .edgeLabel { text-anchor: middle; }
      .decisionText { text-anchor: middle; }
      .edge { fill: none; stroke: #475569; stroke-width: 2.5; marker-end: url(#arrow); }
      .edgeAsync { fill: none; stroke: #7C3AED; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#arrowPurple); }
      .runtime { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 2; filter: url(#shadow); }
      .analysis { fill: #EFF6FF; stroke: #60A5FA; stroke-width: 2; filter: url(#shadow); }
      .decision { fill: #F5F3FF; stroke: #8B5CF6; stroke-width: 2; filter: url(#shadow); }
      .storage { fill: #ECFDF5; stroke: #34D399; stroke-width: 2; filter: url(#shadow); }
      .offline { fill: #FFF7ED; stroke: #FB923C; stroke-width: 2; filter: url(#shadow); }
      .result { fill: #0F172A; stroke: #0F172A; stroke-width: 2; filter: url(#shadow); }
      .resultTitle { font: 700 18px Inter, Arial, sans-serif; fill: #FFFFFF; }
      .resultText { font: 400 13px Inter, Arial, sans-serif; fill: #CBD5E1; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="70" class="title">KaleidoSpeech - Redefining Medical Interaction</text>
  <text x="80" y="102" class="subtitle">Making medical treatment more engaging through interactive AI gamification</text>

  <text x="80" y="154" class="lane">REAL-TIME RUNTIME FLOW</text>
  <line x1="80" y1="166" x2="1520" y2="166" stroke="#CBD5E1" stroke-width="2"/>

  <rect x="80" y="210" width="210" height="130" rx="18" class="runtime"/>
  <circle cx="115" cy="245" r="15" fill="#22C55E"/>
  <text x="145" y="250" class="nodeTitle">Web frontend</text>
  <text x="105" y="282" class="nodeText">Microphone and visual game</text>
  <text x="105" y="306" class="nodeText">Mono 16 kHz PCM</text>
  <text x="105" y="327" class="small">exact 40 ms frames</text>

  <rect x="355" y="210" width="230" height="130" rx="18" class="runtime"/>
  <text x="380" y="250" class="nodeTitle">FastAPI + WebSocket</text>
  <text x="380" y="282" class="nodeText">Session start and control</text>
  <text x="380" y="306" class="nodeText">Validation and rate limiting</text>
  <text x="380" y="327" class="small">progressive and final events</text>

  <rect x="650" y="210" width="250" height="130" rx="18" class="analysis"/>
  <text x="675" y="250" class="nodeTitle">Streaming inference</text>
  <text x="675" y="282" class="nodeText">VAD, quality and rolling window</text>
  <text x="675" y="306" class="nodeText">acoustic refresh every 200 ms</text>
  <text x="675" y="327" class="small">observations, not diagnoses</text>

  <rect x="970" y="190" width="250" height="120" rx="18" class="analysis"/>
  <text x="995" y="230" class="nodeTitle">MFCC + DTW</text>
  <text x="995" y="260" class="nodeText">Compare with real prototypes</text>
  <text x="995" y="284" class="small">word identity and temporal distance</text>

  <rect x="970" y="340" width="250" height="130" rx="18" class="analysis"/>
  <text x="995" y="380" class="nodeTitle">Phonetic engine</text>
  <text x="995" y="410" class="nodeText">wav2vec2/XLS-R + CTC</text>
  <text x="995" y="434" class="nodeText">per-phone forced alignment</text>
  <text x="995" y="455" class="small">runs on the complete utterance</text>

  <rect x="1285" y="245" width="235" height="155" rx="18" class="decision"/>
  <text x="1402.5" y="285" class="nodeTitle decisionText">Decision engine</text>
  <text x="1402.5" y="315" class="nodeText decisionText">Quality - identity - phones</text>
  <text x="1402.5" y="339" class="nodeText decisionText">weighted ensemble and thresholds</text>
  <text x="1402.5" y="366" class="small decisionText">weak evidence = cautious result</text>

  <rect x="1285" y="465" width="235" height="120" rx="18" class="result"/>
  <text x="1310" y="505" class="resultTitle">Final feedback</text>
  <text x="1310" y="532" class="resultText">CORRECT / INCORRECT</text>
  <text x="1310" y="551" class="resultText">UNDECIDABLE / RETRY</text>
  <text x="1310" y="570" class="resultText">REVIEW_REQUIRED</text>

  <path d="M290 275 L355 275" class="edge"/>
  <text x="322.5" y="260" class="small edgeLabel">PCM / WS</text>
  <path d="M585 275 L650 275" class="edge"/>
  <text x="617.5" y="260" class="small edgeLabel">frames</text>
  <path d="M900 250 H935 V240 H970" class="edge"/>
  <path d="M900 300 H935 V425 H970" class="edge"/>
  <path d="M1220 240 H1250 V290 H1285" class="edge"/>
  <path d="M1220 425 H1250 V350 H1285" class="edge"/>
  <path d="M1402 400 L1402 465" class="edge"/>
  <path d="M1285 525 H1245 V620 H185 V340" class="edgeAsync"/>
  <text x="715" y="606" class="small edgeLabel">WebSocket feedback to the UI</text>

  <text x="80" y="640" class="lane">DATA, EVENTS AND CONTINUOUS IMPROVEMENT</text>
  <line x1="80" y1="654" x2="1520" y2="654" stroke="#CBD5E1" stroke-width="2"/>

  <rect x="80" y="705" width="240" height="120" rx="18" class="storage"/>
  <text x="105" y="745" class="nodeTitle">Redis Streams</text>
  <text x="105" y="775" class="nodeText">Ephemeral UI events and state</text>
  <text x="105" y="799" class="small">audio in CLI and demo flows</text>

  <rect x="380" y="705" width="250" height="120" rx="18" class="storage"/>
  <text x="405" y="745" class="nodeTitle">SQLite</text>
  <text x="405" y="775" class="nodeText">Benchmarks and final attempts</text>
  <text x="405" y="799" class="small">provenance, audit and review queue</text>

  <rect x="705" y="705" width="270" height="120" rx="18" class="offline"/>
  <text x="730" y="745" class="nodeTitle">Reviewed dataset</text>
  <text x="730" y="775" class="nodeText">Speaker-disjoint splits</text>
  <text x="730" y="799" class="small">train / validation / frozen test</text>

  <rect x="1050" y="705" width="270" height="120" rx="18" class="offline"/>
  <text x="1075" y="745" class="nodeTitle">Training and calibration</text>
  <text x="1075" y="775" class="nodeText">Random Forest + benchmarks</text>
  <text x="1075" y="799" class="small">versioned artifacts and metrics</text>

  <path d="M420 340 V650 H200 V705" class="edgeAsync"/>
  <path d="M1402 585 V670 H505 V705" class="edge"/>
  <path d="M630 765 L705 765" class="edge"/>
  <text x="667.5" y="750" class="small edgeLabel">review</text>
  <path d="M975 765 L1050 765" class="edge"/>
  <path d="M1185 705 V650 H1545 V322 H1520" class="edgeAsync"/>
  <text x="1365" y="645" class="small edgeLabel">approved artifacts</text>

  <rect x="1370" y="705" width="150" height="120" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="1390" y="740" class="small">GUIDING PRINCIPLE</text>
  <text x="1390" y="770" class="nodeText">No strong verdict</text>
  <text x="1390" y="792" class="nodeText">without strong</text>
  <text x="1390" y="814" class="nodeText">evidence.</text>
</svg>
