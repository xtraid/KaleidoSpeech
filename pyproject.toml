[project]
name = "advx-speech-service"
version = "0.1.0"
description = "Speech service for pronunciation audio streaming and benchmarking"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "numpy>=2.0,<3",
    "pydantic>=2.8,<3",
    "redis>=5,<7",
    "scipy>=1.14,<2",
    "soundfile>=0.13,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
phonetic = [
    "huggingface-hub>=1,<2",
    "phonemizer>=3,<4",
    "torch>=2.4,<3",
    "transformers>=4.45,<6",
]
microphone = [
    "sounddevice>=0.5,<1",
]
ml = [
    "joblib>=1.4,<2",
    "scikit-learn>=1.5,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
